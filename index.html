<style>
  body {
margin: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: linear-gradient(135deg, #ff9a9e, #fad0c4);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
color: #4a1c1c;
}
.card {
background: rgba(255, 255, 255, 0.9);
padding: 2.5rem 3rem;
border-radius: 24px;
max-width: 600px;
text-align: center;
box-shadow: 0 20px 40px rgba(0,0,0,0.15);
animation: float 6s ease-in-out infinite;
}
h1 {
font-size: 2.5rem;
margin-bottom: 1rem;
}
p {
font-size: 1.1rem;
line-height: 1.7;
margin: 0.6rem 0;
}
.heart {
font-size: 3rem;
animation: pulse 1.5s infinite;
margin: 0 1rem;
}
.heart-row {
display: flex;
align-items: center;
justify-content: center;
margin: 1rem 0;
}
.heart-row img {
width: 80px;
height: auto;
background: transparent;
border-radius: 12px;
box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}
.from {
margin-top: 2rem;
font-style: italic;
opacity: 0.8;
}
@keyframes pulse {
0% { transform: scale(1); }
50% { transform: scale(1.2); }
100% { transform: scale(1); }
}
@keyframes float {
0% { transform: translateY(0px); }
50% { transform: translateY(-10px); }
100% { transform: translateY(0px); }
}

.heart-row img.flip {
transform: scaleX(-1);
}
/* pixel hearts background */
.pixel-hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.pixel-heart {
  position: absolute;
  width: 20px;
  height: auto;
  background: transparent;
  opacity: 0.85;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  from {
    transform: translateY(110vh);
  }
  to {
    transform: translateY(-10vh);
  }
}

/* make sure card stays above hearts */
.card {
  position: relative;
  z-index: 1;
}
.pixel-cat {
  position: absolute;
  width: 36px;
  height: auto;
  background: transparent;
  opacity: 0.9;
  animation: floatUp linear infinite;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
}
#yesBtn {
  background: linear-gradient(135deg, #ff6b81, #ff9aa2);
  color: white;
  box-shadow: 0 10px 20px rgba(255, 107, 129, 0.4);
}

#yesBtn:hover {
  transform: scale(0.95);
}

#noBtn {
  background: linear-gradient(135deg, #bbb, #999);
  color: white;
  box-shadow: 0 8px 16px rgba(0,0,0,0.25);
}

#noBtn:hover {
  transform: scale(0.95);
}

.valentine-buttons button {
padding: 1.1rem 2.2rem;
font-size: 1.15rem;
font-weight: 700;
border-radius: 18px;
border: 2px solid rgba(255,255,255,0.6);
cursor: pointer;
transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
</style>
<script>
  
  const container = document.getElementById('pixelHearts');

  const HEART_SRC = 'https://cdn.pixabay.com/photo/2017/09/23/16/33/pixel-heart-2779422_1280.png';

  const CAT_SRCS = [
    'https://png.pngtree.com/recommend-works/png-clipart/20250730/ourmid/pngtree-cute-pixel-cat-character-png-image_16944762.webp',
    'https://freepngimg.com/download/painting/84774-square-art-pixel-rectangle-cat-hd-image-free-png.png',
    'https://png.pngtree.com/png-vector/20250416/ourmid/pngtree-a-cute-pixel-art-illustration-of-smiling-white-paint-with-transparent-vector-png-image_15998177.png',
    'https://art.pixilart.com/aa34a88e46bf2e9.png'
  ];

  const COUNT = 40;

  for (let i = 0; i < COUNT; i++) {
    const isCat = Math.random() < 0.5; // 25% chance cat
    const img = document.createElement('img');

    if (isCat) {
      img.src = CAT_SRCS[Math.floor(Math.random() * CAT_SRCS.length)];
      img.className = 'pixel-cat';
    } else {
      img.src = HEART_SRC;
      img.className = 'pixel-heart';
    }

    const size = isCat
      ? Math.random() * 16 + 28   // cats bigger
      : Math.random() * 12 + 12;  // hearts smaller

    const left = Math.random() * 100;
    const duration = Math.random() * 10 + 8;
    const delay = Math.random() * -20;

    img.style.width = size + 'px';
    img.style.left = left + 'vw';
    img.style.animationDuration = duration + 's';
    img.style.animationDelay = delay + 's';

    container.appendChild(img);
  }

let noClickCount = 0;
const card = document.querySelector('.card');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const buttons = document.querySelector('.valentine-buttons');


yesBtn.addEventListener('click', () => {
card.innerHTML = '<h1>INSTAGRAMZE MOMWERE ! ! !</h1>';
});


noBtn.addEventListener('click', () => {
if (noClickCount < 2) {
const rect = buttons.getBoundingClientRect();
const btnRect = noBtn.getBoundingClientRect();


const maxX = rect.width - btnRect.width;
const maxY = rect.height - btnRect.height;


noBtn.style.position = 'absolute';
noBtn.style.left = Math.random() * maxX + 'px';
noBtn.style.top = Math.random() * maxY + 'px';
noBtn.textContent = 'Are you sure?????????';


noClickCount++;
} else {
card.innerHTML = '<h1>: (</h1>';
}
});
</script>
